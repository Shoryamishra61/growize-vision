# Growize Vision grade policy registry.
#
# THRESHOLD DOCTRINE
# ------------------
# `threshold_mm` values are PUBLISHED_REFERENCE cut-offs compiled from citable
# standards, trade practice, and research variety data (see the per-crop
# `threshold_provenance` block and docs/SIZE_REFERENCE_SOURCES.md).  They are
# NOT ARL/Growize approvals, NOT AGMARK grade documents, and NOT validated on
# any local population; every accepted decision carries a disclaimer saying so.
# A threshold may never exist in this file without a provenance block.
# `demo_threshold_mm` values exist only so the assessment UI can exercise the
# SMALL/BIG decision contract with a clearly labelled demo policy.
version: "policy-2026-10-24.2"
approval_summary: "Published-reference thresholds from citable standards/trade/research; not ARL-approved, not validated on local populations."
guard_band_mm: 0.5
crops:
  potato:
    display_name: Potato
    aliases: [aloo, batata]
    physical_unit: single_tuber
    metric: min_area_rect_short_mm
    metric_description: Projected minimum width of the tuber silhouette, in millimetres, on the calibrated marker plane.
    threshold_mm: 50.0
    threshold_provenance:
      status: PUBLISHED_REFERENCE
      quality: INDUSTRY_TRADE_PRACTICE
      source: "Trade/processing classification: 40-60 mm diameter = medium grade, >60 mm = large; smaller tubers fall outside the processing grade."
      document: "https://intermag.eu/crop-guides-potato"
      definition: "Tuber diameter (projected minimum silhouette axis used as width proxy)."
      basis: "Midpoint 50 mm of the 40-60 mm processing grade as the binary cut; bands use the grade edges."
      retrieved: "2026-10-24"
    approval_status: PUBLISHED_REFERENCE
    size_bands:
      - {name: small, min_mm: 0}
      - {name: medium, min_mm: 40}
      - {name: large, min_mm: 60}
    demo_threshold_mm: 60.0
    demo_size_bands:
      - {name: small, min_mm: 0}
      - {name: medium, min_mm: 45}
      - {name: large, min_mm: 65}
    comparator: greater_than_or_equal
    min_visible_fraction: 0.98
    supported_poses: [overhead, modest_tilt]
  onion:
    display_name: Onion
    aliases: [pyaz, bulb]
    physical_unit: single_bulb
    metric: min_area_rect_short_mm
    metric_description: Projected minimum width of the bulb silhouette, in millimetres, on the calibrated marker plane.
    threshold_mm: 50.0
    threshold_provenance:
      status: PUBLISHED_REFERENCE
      quality: INDUSTRY_TRADE_PRACTICE
      source: "Indian rotary-grader practice: small < 40 mm diameter, medium 40-60 mm, large > 60 mm; mandi practice reports >60 mm bulbs commanding a premium."
      document: "PMC rotary onion-grader study (small/medium/large diameter classes)"
      definition: "Bulb transverse diameter (projected minimum silhouette axis as proxy)."
      basis: "Midpoint 50 mm of the 40-60 mm medium class as the binary cut; bands use the class edges."
      retrieved: "2026-10-24"
    approval_status: PUBLISHED_REFERENCE
    size_bands:
      - {name: small, min_mm: 0}
      - {name: medium, min_mm: 40}
      - {name: large, min_mm: 60}
    demo_threshold_mm: 55.0
    comparator: greater_than_or_equal
    min_visible_fraction: 0.98
    supported_poses: [overhead, modest_tilt]
  tomato:
    display_name: Tomato
    aliases: [tamatar]
    physical_unit: single_fruit
    metric: min_area_rect_short_mm
    metric_description: Projected minimum width of the fruit silhouette (equatorial proxy only when pose is suitable), in millimetres.
    threshold_mm: 57.0
    threshold_provenance:
      status: PUBLISHED_REFERENCE
      quality: OFFICIAL_STANDARD
      source: "CODEX STAN 293 round-tomato size scale: <=47, 47-57, 57-67, 67-82, 82-102, >102 mm diameter."
      document: "https://www.fao.org/input/download/standards/11013/CXS_293e.pdf"
      definition: "Maximum equatorial diameter (projected minimum silhouette axis as proxy for a round fruit in suitable pose)."
      basis: "57 mm boundary between CODEX size codes M (47-57) and B (57-67) as the binary cut; bands group codes into small (<=47), medium (47-67), large (>67)."
      retrieved: "2026-10-24"
    approval_status: PUBLISHED_REFERENCE
    size_bands:
      - {name: small, min_mm: 0}
      - {name: medium, min_mm: 47}
      - {name: large, min_mm: 67}
    demo_threshold_mm: 58.0
    comparator: greater_than_or_equal
    min_visible_fraction: 0.98
    supported_poses: [overhead, modest_tilt]
  okra:
    display_name: Okra
    aliases: [ladyfinger, bhindi, bhendi]
    physical_unit: single_pod
    metric: centerline_length_mm
    metric_description: Curved centreline length of the pod silhouette (skeleton path with terminal-radius compensation), in millimetres; ambiguous branched skeletons are refused for review.
    threshold_mm: 120.0
    threshold_provenance:
      status: PUBLISHED_REFERENCE
      quality: RESEARCH_VARIETY_DATA
      source: "IIVR varieties bear marketable pods of 8-10 cm; Arka Anamika pods measure 13.8-16.1 cm at marketable stage; export preference 6-8 cm."
      document: "https://icariivr.org.in/okra-2 and https://ccari.res.in/dss/okra.html"
      definition: "Pod length along the curved centreline (tip to tip, stem convention per buyer)."
      basis: "120 mm separates standard tender marketable pods (8-10 cm) from long-pod variety types (13.8-16.1 cm)."
      retrieved: "2026-10-24"
    approval_status: PUBLISHED_REFERENCE
    demo_threshold_mm: 100.0
    comparator: greater_than_or_equal
    min_visible_fraction: 0.98
    supported_poses: [overhead, modest_tilt]
  cucumber:
    display_name: Cucumber
    aliases: [kheera, kakdi]
    physical_unit: single_fruit
    metric: min_area_rect_long_mm
    metric_description: Projected longest axis of the fruit silhouette, in millimetres; strongly bent fruit require review.
    threshold_mm: 150.0
    threshold_provenance:
      status: PUBLISHED_REFERENCE
      quality: OFFICIAL_STANDARD_PLUS_RESEARCH
      source: "USDA slicing cucumber standard sets a minimum length of 6 in (152 mm); slicing cucumbers are typically harvested at 15-20 cm; North-American slicing types run 20-30 cm."
      document: "https://www.ams.usda.gov/grades-standards/cucumber-grades-and-standards"
      definition: "Fruit length (projected long axis)."
      basis: "150 mm (rounded USDA 6 in minimum) as the binary cut; bands: below minimum = small, 150-200 mm standard slicing = medium, >=200 mm long types = large."
      retrieved: "2026-10-24"
    approval_status: PUBLISHED_REFERENCE
    size_bands:
      - {name: small, min_mm: 0}
      - {name: medium, min_mm: 150}
      - {name: large, min_mm: 200}
    demo_threshold_mm: 150.0
    comparator: greater_than_or_equal
    min_visible_fraction: 0.98
    supported_poses: [overhead, modest_tilt]
  spinach:
    display_name: Spinach / palak
    aliases: [palak, spinach_leaf]
    physical_unit: single_leaf
