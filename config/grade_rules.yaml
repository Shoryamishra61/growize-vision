# Growize Vision grade policy registry.
#
# IMPORTANT: the `threshold_mm` values under each real crop are deliberately
# null.  ARL/Growize has not supplied approved size thresholds.  `demo_threshold_mm`
# values exist only so the assessment UI can exercise the SMALL/BIG decision
# contract with a clearly labelled, non-authoritative demonstration policy.
# They are NOT agricultural standards, buyer specifications, or ARL approvals.
version: "policy-2026-10-22.1"
approval_summary: "No ARL-approved thresholds supplied; real crop thresholds remain null."
guard_band_mm: 0.5
crops:
  potato:
    display_name: Potato
    aliases: [aloo, batata]
    physical_unit: single_tuber
    metric: min_area_rect_short_mm
    metric_description: Projected minimum width of the tuber silhouette, in millimetres, on the calibrated marker plane.
    threshold_mm: null
    demo_threshold_mm: 60.0
    comparator: greater_than_or_equal
    min_visible_fraction: 0.98
    supported_poses: [overhead, modest_tilt]
  onion:
    display_name: Onion
    aliases: [pyaz, bulb]
    physical_unit: single_bulb
    metric: min_area_rect_short_mm
    metric_description: Projected minimum width of the bulb silhouette, in millimetres, on the calibrated marker plane.
    threshold_mm: null
    demo_threshold_mm: 55.0
    comparator: greater_than_or_equal
    min_visible_fraction: 0.98
    supported_poses: [overhead, modest_tilt]
  tomato:
    display_name: Tomato
    aliases: [tamatar]
    physical_unit: single_fruit
    metric: min_area_rect_short_mm
    metric_description: Projected minimum width of the fruit silhouette (equatorial proxy only when pose is suitable), in millimetres.
    threshold_mm: null
    demo_threshold_mm: 58.0
    comparator: greater_than_or_equal
    min_visible_fraction: 0.98
    supported_poses: [overhead, modest_tilt]
  okra:
    display_name: Okra
    aliases: [ladyfinger, bhindi, bhendi]
    physical_unit: single_pod
    metric: min_area_rect_long_mm
    metric_description: Projected longest straight axis of the pod silhouette, in millimetres; not a curved centreline.
    threshold_mm: null
    demo_threshold_mm: 100.0
    comparator: greater_than_or_equal
    min_visible_fraction: 0.98
    supported_poses: [overhead, modest_tilt]
  cucumber:
    display_name: Cucumber
    aliases: [kheera, kakdi]
    physical_unit: single_fruit
    metric: min_area_rect_long_mm
    metric_description: Projected longest straight axis of the fruit silhouette, in millimetres; strongly bent fruit require review.
    threshold_mm: null
    demo_threshold_mm: 150.0
    comparator: greater_than_or_equal
    min_visible_fraction: 0.98
    supported_poses: [overhead, modest_tilt]
  spinach:
    display_name: Spinach / palak
    aliases: [palak, spinach_leaf]
    physical_unit: single_leaf
    metric: min_area_rect_long_mm
    metric_description: Projected longest axis of a single flat-laid leaf blade, in millimetres. Bunch grading is not supported.
    threshold_mm: null
    demo_threshold_mm: 100.0
    comparator: greater_than_or_equal
    min_visible_fraction: 0.98
    supported_poses: [flattened_leaf]
  coriander:
    display_name: Coriander
    aliases: [dhania, cilantro]
    physical_unit: standardized_bunch_or_single_leaf
    metric: projected_area_cm2
    metric_description: Projected area is not a defensible size grade until the evaluator defines leaf vs standardized bunch and packing procedure.
    threshold_mm: null
    demo_threshold_mm: null
    comparator: greater_than_or_equal
    min_visible_fraction: 1.0
    supported_poses: []
    unsupported_reason: "Coriander has no single size definition in the supplied material. A bunch must be defined and weighed; no demo threshold is offered."
