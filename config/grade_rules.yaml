      definition: "Single flat-laid leaf blade length, petiole excluded where the buyer specification says so."
      basis: "120 mm midpoint of the 10-15 cm mature leaf range as the binary cut; horticulture reference, weaker than a marketing standard."
      retrieved: "2026-10-24"
    approval_status: PUBLISHED_REFERENCE
    demo_threshold_mm: 100.0
    comparator: greater_than_or_equal
    min_visible_fraction: 0.98
    supported_poses: [flattened_leaf]
