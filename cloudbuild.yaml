steps:
  # Build the container image using Google Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/growize-vision:latest', '.']

  # Push the container image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/growize-vision:latest']

  # Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'growize-vision'
      - '--image'
      - 'gcr.io/$PROJECT_ID/growize-vision:latest'
      - '--region'
      - 'asia-south1' # Mumbai / Bangalore region
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/growize-vision:latest'
